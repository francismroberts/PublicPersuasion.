<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Return to the last week visited, unless Home was chosen on purpose from the dropdown.
    (function () {
      try {
        if (sessionStorage.getItem('msc482:homeNav')) { sessionStorage.removeItem('msc482:homeNav'); return; }
        var last = localStorage.getItem('msc482:lastPage');
        var valid = ['week1.html', 'week2.html', 'week3.html', 'week4.html', 'week5.html'];
        if (last && valid.indexOf(last) !== -1) location.replace(last);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Persuasion · Study Dashboard</title>
  <meta name="description" content="Study dashboard for Northwestern's Public Persuasion (MSC 482) — course-wide schedule, pinned deadlines, and progress across all 5 weeks.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4e2a84">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Public Persuasion">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Public Persuasion Study Dashboard">
  <meta property="og:title" content="Public Persuasion · Study Dashboard">
  <meta property="og:description" content="Study dashboard for Northwestern's Public Persuasion (MSC 482) — course-wide schedule, pinned deadlines, and progress across all 5 weeks.">
  <meta property="og:image" content="https://pp.francismroberts.com/og-image.png">
  <meta property="og:url" content="https://pp.francismroberts.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Public Persuasion · Study Dashboard">
  <meta name="twitter:description" content="Study dashboard for Northwestern's Public Persuasion (MSC 482) — course-wide schedule, pinned deadlines, and progress across all 5 weeks.">

</head>
<body data-hub>
  <div class="layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <button class="sb-collapse" id="sbCollapse" title="Hide sidebar" aria-label="Hide sidebar">‹</button>
        <div class="sb-brand">
          <div class="sb-course">Public Persuasion</div>
          <div class="sb-name">🎙️ MSC 482</div>
          <div class="sb-titleline">
            <select class="week-select" data-week-switch aria-label="Switch week"></select>
            <span class="sb-dash">Study Dashboard</span>
          </div>
        </div>
        <div class="sb-progress" id="hubProgress"></div>
        <div class="sb-block">
          <div class="sb-label">On this page</div>
          <nav class="nav-list" id="navList" aria-label="Section navigation"></nav>
        </div>
      </div>
    </aside>
    <button class="sb-show" id="sbShow" title="Show sidebar" aria-label="Show sidebar">›</button>

    <main class="main">
      <div class="hero" id="hero"></div>

      <section class="section-card" id="s-pinned" data-zone="briefing" data-icon="📌" data-nav="Deadlines">
        <div class="section-head"><span class="sh-emoji">📌</span><h2>Key Deadlines</h2></div>
        <div class="section-body"><div class="pin-grid" id="hubPinned"></div></div>
      </section>

      <section class="section-card" id="s-schedule" data-zone="briefing" data-icon="🗓️" data-nav="Schedule">
        <div class="section-head"><span class="sh-emoji">🗓️</span><h2>Course Schedule</h2></div>
        <div class="section-body flush" id="hubSchedule"></div>
      </section>

      <section class="section-card" id="s-weeks" data-zone="briefing" data-icon="📅" data-nav="Weeks">
        <div class="section-head"><span class="sh-emoji">📅</span><h2>The Five Weeks</h2></div>
        <div class="section-body"><div class="wk-grid" id="hubWeeks"></div></div>
      </section>
    </main>
  </div>

  <div class="m-backdrop" id="mBackdrop"></div>
  <aside class="m-drawer" id="mDrawer" role="dialog" aria-label="Navigation"></aside>
  <nav class="m-bar" id="mBar" aria-label="Quick navigation"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
